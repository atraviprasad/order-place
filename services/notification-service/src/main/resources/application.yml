server:
  port: 8086
  servlet:
    context-path: /api/v1
spring:
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/orderplace}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/orderplace/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  # Spring Boot 4 moved the MongoDB connection settings from spring.data.mongodb to spring.mongodb
  mongodb:
    uri: ${MONGO_URI:mongodb://orderplace:change_me_mongo@localhost:27017/notification_db?authSource=admin}
  data:
    mongodb:
      auto-index-creation: true     # creates the unique (eventId, recipientRole) index that guards against duplicates
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
app:
  web-url: ${APP_WEB_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@orderplace.local}
notifications:
  max-attempts: 4            # first try + 3 retries
  retry-initial-ms: 2000     # then 4s, 8s (doubling)
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
