server:
  port: 8084
  servlet:
    context-path: /api/v1
spring:
  application:
    name: order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/orderplace}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/orderplace/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${POSTGRES_USER:orderplace}
    password: ${POSTGRES_PASSWORD:change_me_postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
  task:
    scheduling:
      pool:
        size: 2
services:
  # base URLs INCLUDE the /api/v1 context path (changed from the skeleton)
  catalog-url: ${CATALOG_URL:http://localhost:8082/api/v1}
  dealer-url: ${DEALER_URL:http://localhost:8083/api/v1}
  user-url: ${USER_URL:http://localhost:8081/api/v1}
orders:
  max-lines: 50
  outbox:
    poll-interval-ms: 1000
    batch-size: 50
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
