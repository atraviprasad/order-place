<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Your order was approved</title></head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #222; line-height: 1.5;">
  <div style="max-width: 560px; margin: 0 auto; padding: 16px;">
    <h2 style="margin-top: 0;">Your order was approved</h2>
    <p>Hello <span th:text="${customerName}">Customer</span>,</p>
    <p>Your order <strong th:text="${orderNumber}">OP-2026-000001</strong> has been approved by the dealer.</p>
    <p>Amount to pay: <strong th:text="${total}">INR 0.00</strong>.</p>
    <p th:if="${reason}">Dealer remarks: <em th:text="${reason}">remarks</em></p>
    <p>Please open the order to complete the payment.</p>
    <p><a th:href="${orderLink}" href="#" style="background: #1a56db; color: #fff; padding: 10px 16px; text-decoration: none; border-radius: 4px;">Open order</a></p>
    <p style="color: #777; font-size: 12px;">This is an automated message from Order Place. Please do not reply.</p>
  </div>
</body>
</html>
