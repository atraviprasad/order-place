server:
  port: 8083
  servlet:
    context-path: /api/v1
spring:
  application:
    name: dealer-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/orderplace}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/orderplace/protocol/openid-connect/certs}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dealer_db}
    username: ${POSTGRES_USER:orderplace}
    password: ${POSTGRES_PASSWORD:change_me_postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  # DEV: also load seed data (db/dev). In production use only classpath:db/migration
    locations: classpath:db/migration,classpath:db/dev
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
